<!DOCTYPE html
  PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="es">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apunto Motors - Gracias por escribirnos</title>
</head>

<body style="margin: 0; padding: 0; font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #0b0b0b;">
  <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #0b0b0b; padding: 20px 0;">
    <tr>
      <td align="center">
        <table border="0" cellpadding="0" cellspacing="0" width="600" style="max-width: 600px; width: 100%; background-color: #141414; border-radius: 12px; border: 1px solid #222222; overflow: hidden;">
          <tr>
            <td align="center" style="padding: 40px 30px;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td align="center" style="padding-bottom: 25px;">
                    <img src="{{domain}}/assets/img/logoapuntomotor.png" alt="Apunto Motors Logo"
                      style="display: block; width: 220px; max-width: 100%; height: auto;" />
                  </td>
                </tr>
                <tr>
                  <td align="center" style="padding-top: 10px;">
                    <h1
                      style="font-size: 26px; font-weight: 800; line-height: 1.2; color: #FFFFFF; margin: 0; letter-spacing: -0.5px;">
                      ¡Gracias por escribirnos!</h1>
                  </td>
                </tr>
                <tr>
                  <td align="center" style="padding-top: 16px;">
                    <p style="font-size: 15px; line-height: 1.6; color: #D1D5DB; margin: 0; max-width: 480px;">
                      ¡Hola <strong style="color: #FFFFFF;">{{contact.name}}</strong>!<br>
                      Hemos recibido tu mensaje correctamente. Nuestro equipo de especialistas de <strong>Apunto Motors</strong> se pondrá en contacto contigo a la brevedad posible.
                    </p>
                  </td>
                </tr>
                <tr>
                  <td align="center" style="padding-top: 28px;">
                    <table border="0" cellpadding="0" cellspacing="0">
                      <tr>
                        <td align="center" bgcolor="#dc2626" style="border-radius: 8px;">
                          <a href="{{domain}}" target="_blank"
                            style="display: inline-block; padding: 12px 28px; font-size: 14px; font-weight: bold; color: #FFFFFF; text-decoration: none; text-transform: uppercase; letter-spacing: 0.5px;">VISITAR NUESTRA WEB</a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td align="center" style="padding-top: 40px; border-top: 1px solid #262626; margin-top: 30px;">
                    <p style="font-size: 12px; line-height: 1.5; color: #9CA3AF; margin: 0;">
                      <strong style="color: #D1D5DB;">Apunto Motors</strong><br>
                      Taller Mecánico Automotriz Especializado<br>
                      Lima, Perú
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>

</html>
